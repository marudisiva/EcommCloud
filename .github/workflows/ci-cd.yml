name: ECommCloud CI/CD (Local Deployement)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  builds:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v3
          with:
            fetch-depth: 0

        - name: Set up JDK 17
          uses: actions/setup-java@v3

          with:
            java-version: '17'
            distribution: 'temurin'

        - name: Build & Test All Microservices (Maven)
          run: |
            cd backend/product-service && mvn clean package -DskipTests
#            cd ../user-service && mvn clean package -DskipTests
#            cd ../cart-service && mvn clean package -DskipTests
#            cd ../order-service && mvn clean package -DskipTests
#            cd ../payment-service && mvn clean package -DskipTests

        - name: Install Minikube & Kubectl
          run: |
            curl -Lo minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
            chmod +x minikube
            sudo mv minikube /usr/local/bin/
            minikube start --driver=docker
            minikube status
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/

        - name: Build Docker Image
          run: |
            eval $(minikube docker-env)
            docker build -t cloud-product-service:latest -f backend/product-service/Dockerfile backend/product-service/
#            docker build -t cloud-user-service:latest -f backend/user-service/Dockerfile user-service
#            docker build -t cloud-order-service:latest -f backend/order-service/Dockerfile order-service
#            docker build -t cloud-cart-service:latest -f backend/cart-service/Dockerfile cart-service
#            docker build -t cloud-ui-service:latest -f UI/Dockerfile UI
        - name: Load Image into Minikube
          run: |
            minikube image load cloud-product-service:latest
#            minikube image load cloud-user-service:latest
#            minikube image load cloud-order-service:latest
#            minikube image load cloud-cart-service:latest
#            minikube image load cloud-ui-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: builds
    steps:
      - name: Start Minikube
        run: |
          minikube start --driver=docker
          minikube status

      - name: Debug Kubernetes Deployment
        run: |
          echo "Checking Kubernetes Pods..."
          kubectl get pods -A
          echo "Checking Kubernetes Deployments..."
          kubectl get deployments -A
          echo "Checking Kubernetes Services..."
          kubectl get svc -A
          echo "Checking Pod Logs..."
          kubectl logs -l app=product-service --tail=50 || echo "❌ No logs found for product-service"

      - name: List k8s Directory Contents
        run: |
          ls -la k8s

      - name: Deploy on Minikube
        run: |
          kubectl apply -f k8s/product-service-deployment.yaml
#          kubectl apply -f k8s/user-service-deployment.yaml
#          kubectl apply -f k8s/order-service-deployment.yaml
#          kubectl apply -f k8s/cart-service-deployment.yaml
#          kubectl apply -f k8s/ui-service-deployment.yaml
#          kubectl apply -f k8s/user-service-service.yaml
#          kubectl apply -f k8s/product-service-service.yaml
#          kubectl apply -f k8s/order-service-service.yaml
#          kubectl apply -f k8s/cart-service-service.yaml
#          kubectl apply -f k8s/ui-service-service.yaml

      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get svc
          kubectl get deployments

      - name: Expose Service
        run: |
          echo "Access Product Service at: https://$(minikube ip):$(kubectl get svc product-service -o=jsonpath='{.spec.ports[0].nodePort}')"

